<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/writing.css">
  <title>Writing Page</title>
</head>
<body>
  <div class="app">
    <!-- Zaglavlje -->
    <header class="header">
      <div class="header-left">
        <!-- SVG strelica nazad -->
        <button class="back-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 1-.5.5H2.707l5.147 5.146a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708.708L2.707 7.5H14.5A.5.5 0 0 1 15 8z"/>
          </svg>
        </button>
        <span class="project-title">THE LAST STARSHIP (Draft 2)</span>
      </div>
      <div class="header-center">
        <button class="header-btn">SCENA</button>
        <button class="header-btn">AKCIJA</button>
        <button class="header-btn">LIK</button>
        <button class="header-btn">DIJALOG</button>
      </div>
      <div class="header-right">
  <input id="scenarioInput" type="number" min="1" placeholder="ID" class="scenario-input">
  <button id="loadScenarioBtn" class="load-btn" type="button">UČITAJ SCENARIO</button>
  <button class="save-btn" type="button">SPASI</button>
</div>

    </header>

    <div class="editor-toolbar">
      <button data-action="bold">Bold</button>
      <button data-action="italic">Italic</button>
      <button data-action="underline">Underline</button>
      <button data-action="brojRijeci">Broj riječi</button>
      <button data-action="dajUloge">Prepoznaj uloge</button>
      <button data-action="pogresnaUloga">Pogrešne uloge</button>
      <button data-action="brojLinijaTeksta">Broj linija</button>
      <button data-action="scenarijUloge">Scenarij za ulogu</button>
      <button data-action="grupisiUloge">Grupiši uloge</button>
      <button data-action="lockUloga">Zaključaj ulogu</button>
     <button data-action="renameUloga">Preimenuj ulogu</button>
     <button data-action="prikaziPromjene">Prikaži promjene</button>

    </div>

   
    <div id="poruke"></div>

    <!-- Glavni sadržaj -->
    <main class="main-container">
     
      <aside class="sidebar">
        <h3>Scenes (3)</h3>
        <ul class="scene-list">
          <li class="scene active">
            <span class="scene-num">1.</span>
            <span class="scene-title">INT. STARSHIP BRIDGE – NIGHT</span>
            <span class="scene-pages">(5/8)</span>
          </li>
          <li class="scene">
            <span class="scene-num">2.</span>
            <span class="scene-title">EXT. ASTEROID FIELD – DAY</span>
            <span class="scene-pages">(3/8)</span>
          </li>
          <li class="scene">
            <span class="scene-num">3.</span>
            <span class="scene-title">INT. ENGINE ROOM – NIGHT</span>
            <span class="scene-pages">(2/8)</span>
          </li>
        </ul>
      </aside>

      
      <div class="editor-container">
        <div class="editor" id="divEditor" contenteditable="true">
        
        </div>
      </div>
    </main>
  </div>

  
  <script src="../js/EditorTeksta.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/PoziviAjaxFetch.js"></script>
  <script src="../js/writing-connect.js"></script>

</body>
</html>
