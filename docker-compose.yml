version: '2'
services:

 mysql-db:
  image: mysql:latest
  container_name: mysql-db
  networks:
   - arm-mreza
  environment:
   - MYSQL_ROOT_PASSWORD=password
   - MYSQL_DATABASE=wt26

 wtapp26:
  build: .
  image: ihindija1/arm-zadaca:latest
  container_name: wt26app
  ports:
   - "3000:3000"
  networks:
   - arm-mreza
  depends_on:
   - mysql-db
  deploy:
   restart_policy:
    condition: on-failure
    max_attempts: 10

networks:
 arm-mreza:
  name: arm-mreza
  driver: bridge
  external: true
